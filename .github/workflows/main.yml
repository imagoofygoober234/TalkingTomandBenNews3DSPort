
name: Build Tom and Ben 3DS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Download game files
        uses: actions/checkout@v4

      - name: Organize source files
        shell: bash
        run: |
          mkdir -p source
          for file in main.c voice.c voice.h; do
            if [ -f "$file" ]; then
              mv "$file" source/
            fi
          done

      - name: Check game files
        shell: bash
        run: |
          ls -la
          test -f Makefile
          test -f source/main.c
          test -f source/voice.c

      - name: Compile game
        shell: bash
        run: |
          make -j2

      - name: Save build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TomBen3DS-Build
          path: |
            *.3dsx
            *.elf
            *.smdh
            *.cia
          if-no-files-found: warn
